version: "2.2"

services:
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.2
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
    user: "0"
    command: >
      bash -c '
        if [ xformation == x ]; then
          echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
          exit 1;
        elif [ xformation == x ]; then
          echo "Set the KIBANA_PASSWORD environment variable in the .env file";
          exit 1;
        fi;
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          echo -ne \
          "instances:\n"\
          "  - name: es01\n"\
          "    dns:\n"\
          "      - es01\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "  - name: es02\n"\
          "    dns:\n"\
          "      - es02\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        if [ ! -f config/certs/fleet-server/fleet-server.crt ]; then
          echo "Creating Fleet Server cert";
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/fleet.zip --name fleet-server --dns fleet-server,localhost --ip 127.0.0.1 --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/fleet.zip -d config/certs;
        fi;
        echo "Setting file permissions"
        chown -R root:root config/certs;
        find . -type d -exec chmod 750 \{\} \;;
        find . -type f -exec chmod 640 \{\} \;;
        echo "Waiting for Elasticsearch availability";
        until curl -s --cacert config/certs/ca/ca.crt https://es01:9200 | grep -q "missing authentication credentials"; do sleep 30; done;
        echo "Setting kibana_system password";
        until curl -s -X POST --cacert config/certs/ca/ca.crt -u elastic:formation -H "Content-Type: application/json" https://es01:9200/_security/user/kibana_system/_password -d "{\"password\":\"formation\"}" | grep -q "^{}"; do sleep 10; done;
        echo "Setting elastic password (stored cluster-wide, not only in es01 keystore)";
        until curl -s -X POST --cacert config/certs/ca/ca.crt -u elastic:formation -H "Content-Type: application/json" https://es01:9200/_security/user/elastic/_password -d "{\"password\":\"formation\"}" | grep -q "^{}"; do sleep 10; done;
        echo "All done!";
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/fleet-server/fleet-server.crt ]"]
      interval: 1s
      timeout: 5s
      retries: 120

  es01:
    depends_on:
      setup:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.2
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - esdata01_tp3:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    environment:
      - node.name=es01
      - cluster.name=docker-cluster
      - cluster.initial_master_nodes=es01,es02
      - discovery.seed_hosts=es02
      - ELASTIC_PASSWORD=formation
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es01/es01.key
      - xpack.security.http.ssl.certificate=certs/es01/es01.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.http.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es01/es01.key
      - xpack.security.transport.ssl.certificate=certs/es01/es01.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=trial
      - xpack.monitoring.collection.enabled=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    mem_limit: 2g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  es02:
    depends_on:
      - es01
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.2
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - esdata02_tp3:/usr/share/elasticsearch/data
    environment:
      - node.name=es02
      - cluster.name=docker-cluster
      - cluster.initial_master_nodes=es01,es02
      - discovery.seed_hosts=es01
      - ELASTIC_PASSWORD=formation
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es02/es02.key
      - xpack.security.http.ssl.certificate=certs/es02/es02.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.http.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es02/es02.key
      - xpack.security.transport.ssl.certificate=certs/es02/es02.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=trial
      - xpack.monitoring.collection.enabled=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    mem_limit: 2g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  kibana:
    depends_on:
      es01:
        condition: service_healthy
      es02:
        condition: service_healthy
    image: docker.elastic.co/kibana/kibana:8.18.2
    volumes:
      - certs:/usr/share/kibana/config/certs
      - kibanadata_tp3:/usr/share/kibana/data
    ports:
      - 5601:5601
    environment:
      - SERVERNAME=kibana
      # Kibana connait les 2 noeuds : si es01 tombe, il bascule sur es02
      - 'ELASTICSEARCH_HOSTS=["https://es01:9200","https://es02:9200"]'
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=formation
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=aslkdjfhs-sdfsd-safd-sffd-sdfsadffsafdsdf
      - XPACK_REPORTING_CAPTURE_BROWSER_CHROMIUM_DISABLESANDBOX=true
      - XPACK_APM_SERVICEMAPENABLED=true
    mem_limit: 1g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  load-sample-data:
    depends_on:
      kibana:
        condition: service_healthy
    image: curlimages/curl:latest
    entrypoint: >
      sh -c "
        echo 'Attente de la disponibilité du serveur Kibana...';
        until curl -s -u elastic:formation http://kibana:5601/api/status | grep -q '\"level\":\"available\"'; do sleep 5; done;
        echo 'Chargement des datasets de démo...';
        curl -s -u elastic:formation -X POST 'http://kibana:5601/api/sample_data/ecommerce' -H 'kbn-xsrf: true';
        curl -s -u elastic:formation -X POST 'http://kibana:5601/api/sample_data/flights' -H 'kbn-xsrf: true';
        curl -s -u elastic:formation -X POST 'http://kibana:5601/api/sample_data/logs' -H 'kbn-xsrf: true';
        echo 'Datasets installés !';
      "

  # Configure Fleet dans Kibana : sortie Elasticsearch (avec la CA),
  # URL du Fleet Server et politique "Fleet Server Policy".
  # Les erreurs 409 au redemarrage de la stack sont normales (deja cree).
  fleet-setup:
    depends_on:
      kibana:
        condition: service_healthy
    image: curlimages/curl:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo 'Attente de Kibana...'
        until curl -s -u elastic:formation http://kibana:5601/api/status | grep -q '"level":"available"'; do sleep 5; done
        echo 'Initialisation de Fleet...'
        until curl -s -u elastic:formation -X POST http://kibana:5601/api/fleet/setup -H 'kbn-xsrf: true' | grep -q '"isInitialized":true'; do sleep 5; done
        echo 'Sortie Elasticsearch par defaut (es01 + es02, CA du cluster)'
        curl -s -u elastic:formation -X POST http://kibana:5601/api/fleet/outputs -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
          -d '{"id":"es-tp3","name":"Elasticsearch TP3","type":"elasticsearch","hosts":["https://es01:9200","https://es02:9200"],"is_default":true,"is_default_monitoring":true,"config_yaml":"ssl.certificate_authorities: [\"/certs/ca/ca.crt\"]"}'
        echo
        echo 'URL du Fleet Server'
        curl -s -u elastic:formation -X POST http://kibana:5601/api/fleet/fleet_server_hosts -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
          -d '{"id":"fleet-server-tp3","name":"Fleet Server TP3","host_urls":["https://fleet-server:8220"],"is_default":true}'
        echo
        echo 'Politique Fleet Server'
        curl -s -u elastic:formation -X POST 'http://kibana:5601/api/fleet/agent_policies?sys_monitoring=true' -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
          -d '{"id":"fleet-server-policy","name":"Fleet Server Policy","namespace":"default","has_fleet_server":true,"monitoring_enabled":["logs","metrics"]}'
        echo
        echo 'Fleet est pret !'

  # Elastic Agent en mode Fleet Server : il s'enrole lui-meme dans la
  # politique "Fleet Server Policy" et ecoute sur https://fleet-server:8220
  fleet-server:
    depends_on:
      fleet-setup:
        condition: service_completed_successfully
    image: docker.elastic.co/beats/elastic-agent:8.18.2
    hostname: fleet-server
    user: root
    volumes:
      - certs:/certs:ro
    ports:
      - 8220:8220
    environment:
      - FLEET_SERVER_ENABLE=1
      - FLEET_SERVER_POLICY_ID=fleet-server-policy
      - FLEET_SERVER_ELASTICSEARCH_HOST=https://es01:9200
      - FLEET_SERVER_ELASTICSEARCH_CA=/certs/ca/ca.crt
      - FLEET_SERVER_CERT=/certs/fleet-server/fleet-server.crt
      - FLEET_SERVER_CERT_KEY=/certs/fleet-server/fleet-server.key
      - FLEET_URL=https://fleet-server:8220
      - FLEET_CA=/certs/ca/ca.crt
      - KIBANA_FLEET_SETUP=1
      - KIBANA_FLEET_HOST=http://kibana:5601
      - KIBANA_FLEET_USERNAME=elastic
      - KIBANA_FLEET_PASSWORD=formation
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=formation
    mem_limit: 1g

volumes:
  certs:
    driver: local
  esdata01_tp3:
    driver: local
  esdata02_tp3:
    driver: local
  kibanadata_tp3:
    driver: local